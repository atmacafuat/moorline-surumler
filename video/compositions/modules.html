  <script>
    (function () {
            const tl = gsap.timeline({ paused: true });
      const B = [0.3, 2.1, 3.6, 5.1, 6.6, 8.1, 9.6, 11.5];
      // hide every packet until it travels
      tl.fromTo(".pk", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      const P = document.querySelector("#m-path");
      const PL = P.getTotalLength();
      const travel = (sel, t0, dur, back) => {
        const el = typeof sel === "string" ? document.querySelector(sel) : sel;
        const w = el.offsetWidth / 2, h = el.offsetHeight / 2;
        const place = (p) => { const pt = P.getPointAtLength((back ? 1 - p : p) * PL); gsap.set(el, { x: pt.x - w, y: pt.y - h }); };
        const proxy = { p: 0 };
        place(0);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, t0);
        tl.fromTo(proxy, { p: 0 }, { p: 1, duration: dur, ease: "power2.inOut", immediateRender: false, onUpdate: () => place(proxy.p) }, t0);
        tl.to(el, { opacity: 0, duration: 0.08 }, t0 + dur - 0.04);
      };
      const layer = (sel, t0, t1) => {
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: false }, t0);
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, t1 - 0.12);
      };
      const cap = (sel, t0, t1) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, t0);
        tl.fromTo(sel + " .lab", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, t0);
        tl.fromTo(sel + " .ln span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.06, ease: "power4.out" }, t0 + 0.05);
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, t1 - 0.13);
      };

      // stage enters from below (continues the whip up)
      tl.fromTo("#m-stage", { y: 900, filter: "blur(16px)" }, { y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);
      tl.fromTo("#m-dots", { strokeDashoffset: 0 }, { strokeDashoffset: -46 * 8, duration: 12, ease: "none" }, 0);

      // ---- Goz
      let b = B[0];
      cap("#c-goz", b, B[1]); layer("#p-goz", b - 0.1, B[1]); layer("#q-goz", b + 0.95, B[1]);
      tl.fromTo("#p-sheet", { y: 170 }, { y: 0, duration: 0.3, ease: "expo.out" }, b + 0.15);
      tl.fromTo("#p-share", { scale: 1 }, { scale: 0.84, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.inOut" }, b + 0.42);
      travel("#k-reel", b + 0.5, 0.5);
      tl.fromTo("#q-note", { scale: 0.7, transformOrigin: "0% 60%" }, { scale: 1, duration: 0.35, ease: "expo.out" }, b + 0.95);
      tl.fromTo("#q-goz .q-ok", { scale: 0 }, { scale: 1, duration: 0.22, stagger: 0.1, ease: "back.out(2.5)" }, b + 1.0);
      tl.fromTo("#q-goz .q-nb", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.3, stagger: 0.06, ease: "expo.out" }, b + 1.1);

      // ---- Conch
      b = B[1];
      cap("#c-conch", b, B[2]); layer("#p-conch", b, B[2]); layer("#q-conch", b + 0.1, B[2]);
      document.querySelectorAll(".m-eq").forEach((el, i) => {
        tl.fromTo(el, { scaleY: 0.25 + 0.15 * (i % 3), transformOrigin: "50% 100%" }, { scaleY: 1 - 0.12 * (i % 2), duration: 0.16 + 0.03 * i, yoyo: true, repeat: 7, ease: "sine.inOut" }, b);
      });
      document.querySelectorAll(".k-note").forEach((el, i) => travel(el, b + 0.15 + i * 0.14, 0.5));
      tl.fromTo("#q-pill", { x: 340, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, b + 0.55);
      tl.fromTo("#q-prog", { scaleX: 0.1, transformOrigin: "0 50%" }, { scaleX: 0.55, duration: 1.0, ease: "none" }, b + 0.5);

      // ---- Wake
      b = B[2];
      cap("#c-wake", b, B[3]); layer("#p-wake", b, B[3]); layer("#q-wake", b + 0.05, B[3]);
      tl.fromTo("#p-wake4", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, b + 1.15);
      document.querySelectorAll(".k-file").forEach((el, i) => travel(el, b + 0.12 + i * 0.12, 0.48));
      document.querySelectorAll(".q-pr").forEach((el, i) => {
        tl.fromTo(el, { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.35 + i * 0.22, ease: "power1.inOut" }, b + 0.5 + i * 0.1);
      });
      travel("#k-back", b + 0.75, 0.45, true);

      // ---- Ekran + Kamera
      b = B[3];

      tl.fromTo("#q-win", { x: 0, filter: "blur(0px)" }, { x: -620, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, b + 0.12);

      tl.fromTo("#p-vol", { scaleX: 0.45, transformOrigin: "0 50%" }, { scaleX: 0.98, duration: 0.45, ease: "power2.inOut" }, b + 0.15);
      tl.fromTo("#q-vol", { scaleX: 0.45, transformOrigin: "0 50%" }, { scaleX: 0.98, duration: 0.45, ease: "power2.inOut" }, b + 0.2);
      tl.fromTo("#p-lockbtn", { scale: 1 }, { scale: 0.86, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.inOut" }, b + 0.68);
      travel("#k-lock", b + 0.72, 0.36);
      tl.fromTo("#q-lock", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, b + 1.06);
      tl.fromTo("#q-lock svg", { scale: 0.6, y: 20 }, { scale: 1, y: 0, duration: 0.3, ease: "expo.out" }, b + 1.06);

      // ---- Sync
      b = B[5];
      cap("#c-sync", b, B[6]); layer("#p-sync", b, B[6]); layer("#q-sync", b + 0.05, B[6]);
      travel("#k-clip1", b + 0.12, 0.45);
      tl.fromTo("#q-paste", { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, b + 0.55);

      tl.fromTo("#p-paste", { opacity: 0, scale: 0.85, transformOrigin: "100% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, b + 1.15);

      // ---- Siri
      b = B[6];
      cap("#c-siri", b, B[7]); layer("#p-siri", b, B[7] + 0.2); layer("#q-siri", b + 0.95, B[7] + 0.2);
      tl.fromTo("#p-say span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, stagger: 0.06, ease: "power4.out" }, b + 0.08);

        tl.fromTo(el, { scaleY: 0.2 + 0.1 * (i % 3) }, { scaleY: 0.9 - 0.15 * (i % 2), duration: 0.12 + 0.02 * (i % 4), yoyo: true, repeat: 5, ease: "sine.inOut" }, b);
      });
      tl.fromTo("#p-photo", { scale: 1 }, { scale: 0.6, opacity: 0, duration: 0.25, ease: "power3.in" }, b + 0.6);
      travel("#k-photo", b + 0.62, 0.42);
      tl.fromTo("#q-photo", { scale: 0.25, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.4, ease: "expo.out" }, b + 1.0);

      // ---- out: PC leaves, rope drops, phone steps to centre
      const t = 11.5;
      tl.to("#m-pc", { x: 900, filter: "blur(16px)", duration: 0.3, ease: "power3.in" }, t);
      tl.to("#m-rope", { opacity: 0, duration: 0.2, ease: "power2.in" }, t);
      tl.to("#m-phone", { x: 330, duration: 0.45, ease: "power2.inOut" }, t);
      window.__timelines["modules"] = tl;
    })();
