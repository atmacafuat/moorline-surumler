<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Moorline — your iPhone, moored to your PC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0553A"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0553A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F0553A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="900" cy="230" rx="360" ry="200" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="88" y="190" fill="#F2F3F5" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2">Moorline</text>
  <text x="92" y="244" fill="#8E939B" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30">Your iPhone, moored to your PC.</text>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#c9ccd1">
    <rect x="92" y="290" rx="15" width="132" height="30" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="158" y="311" text-anchor="middle">Local only</text>
    <rect x="236" y="290" rx="15" width="150" height="30" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="311" y="311" text-anchor="middle">Pinned TLS</text>
    <rect x="398" y="290" rx="15" width="168" height="30" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="482" y="311" text-anchor="middle">~3 MB at idle</text>
  </g>

  <!-- phone -->
  <g transform="translate(735 105)">
    <rect width="118" height="230" rx="24" fill="#1d2025" stroke="#3a3e46" stroke-width="3"/>
    <rect x="10" y="12" width="98" height="206" rx="16" fill="#0c0d0f"/>
    <rect x="44" y="20" width="30" height="8" rx="4" fill="#3a3e46"/>
    <circle cx="59" cy="115" r="16" fill="none" stroke="#F0553A" stroke-width="3"/>
    <circle cx="59" cy="115" r="5" fill="#F0553A"/>
  </g>

  <!-- mooring line -->
  <path d="M853 220 C 930 300, 1000 300, 1052 230" fill="none" stroke="url(#rope)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11"/>
  <path d="M853 220 C 930 300, 1000 300, 1052 230" fill="none" stroke="url(#rope)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="853" cy="220" r="7" fill="#F0553A"/>
  <circle cx="1052" cy="230" r="7" fill="#F0553A"/>

  <!-- pc -->
  <g transform="translate(1040 120)">
    <rect width="190" height="128" rx="12" fill="#1d2025" stroke="#3a3e46" stroke-width="3"/>
    <rect x="12" y="12" width="166" height="104" rx="6" fill="#0c0d0f"/>
    <rect x="26" y="30" width="70" height="8" rx="4" fill="#3a3e46"/>
    <rect x="26" y="48" width="120" height="8" rx="4" fill="#3a3e46"/>
    <rect x="26" y="66" width="96" height="8" rx="4" fill="#F0553A" opacity="0.85"/>
    <rect x="80" y="128" width="30" height="26" fill="#1d2025"/>
    <rect x="55" y="152" width="80" height="8" rx="4" fill="#3a3e46"/>
  </g>
</svg>
